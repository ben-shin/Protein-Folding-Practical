[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-folding-practical"
version = "0.1.0"
description = "GUI workflow for importing, organising, fitting, and exporting GFP GuHCl denaturation data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
protein-folding-practical = "folding_practical.app:main"

[tool.setuptools.packages.find]
include = ["folding_practical*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
